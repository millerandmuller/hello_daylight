<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hello Daylight{% endblock %}</title>
  <link rel="icon" href="data:,">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx-2.0.4.min.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <a href="/" class="brand">Hello Daylight</a>
    <nav class="nav" aria-label="Main">
      {% if user %}
        <a href="/app">Projects</a>
        {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
        <form method="post" action="/auth/logout" class="inline"><button type="submit" class="link">Sign out ({{ user.email }})</button></form>
      {% else %}
        <a href="/try">Try with your key</a>
        <a href="/login">Sign in</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
